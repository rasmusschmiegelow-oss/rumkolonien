<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rumkolonien</title>
  <meta name="description" content="Byg en koloni på Mars: dyrk afgrøder i drivhuskupler, producer varer og lever ordrer til fragtskibe.">
  <meta name="theme-color" content="#120d1c">
  <link rel="icon" href="assets/icons/rocket.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hud">
    <div class="stats">
      <div class="stat" title="Kreditter"><img class="ic" src="assets/icons/coin.svg" alt=""><b id="credits">0</b></div>
      <div class="stat level" title="Niveau og erfaring">
        <img class="ic" src="assets/icons/xp.svg" alt=""><b id="level">1</b>
        <div class="xpbar"><div id="xpfill"></div></div>
        <small id="xptext">0/15</small>
      </div>
      <div class="stat clock" id="clock" title="Tid på Mars"></div>
    </div>
    <nav class="actions">
      <button data-act="orders" title="Ordrer"><img class="ic" src="assets/icons/rocket.svg" alt=""><span class="lbl">Ordrer</span><span id="orderBadge" class="badge" hidden>0</span></button>
      <button data-act="inventory" title="Lager"><img class="ic" src="assets/icons/box.svg" alt=""><span id="silo" class="silo-count">0/50</span></button>
      <button data-act="colony" title="Mål, robotter og kolonister"><img class="ic" src="assets/icons/goal.svg" alt=""><span class="lbl">Koloni</span><span id="colonyBadge" class="badge" hidden>0</span></button>
      <button data-act="sound" id="soundBtn" class="icon-btn" aria-label="Lyd til eller fra"></button>
      <button data-act="help" class="icon-btn" aria-label="Hjælp">?</button>
    </nav>
  </header>

  <main>
    <div class="map-wrap">
      <canvas id="map" aria-label="Kort over kolonien"></canvas>
      <div id="tutorial" class="banner top" hidden></div>
      <div id="eventBanner" class="banner bottom" hidden></div>
    </div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="sheet-head">
        <h2 id="modalTitle"></h2>
        <button class="close" data-act="close" aria-label="Luk">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/state.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
