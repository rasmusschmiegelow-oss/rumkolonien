<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rumkolonien</title>
  <meta name="description" content="Byg en koloni på Mars: dyrk afgrøder i drivhuskupler, producer varer og lever ordrer til fragtskibe.">
  <meta name="theme-color" content="#120d1c">
  <link rel="icon" href="assets/icons/rocket.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/app-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rumkolonien">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hud">
    <div class="stats">
      <div class="stat" title="Kreditter"><img class="ic" src="assets/icons/coin.svg" alt=""><b id="credits">0</b></div>
      <div class="stat level" title="Niveau og erfaring">
        <img class="ic" src="assets/icons/xp.svg" alt=""><b id="level">1</b>
        <div class="xpbar"><div id="xpfill"></div></div>
        <small id="xptext">0/15</small>
      </div>
      <div class="stat happy" id="happy" title="Koloniens lykke: bonus på alle ordrer" hidden><img class="ic" src="assets/icons/lykke.svg" alt=""><b id="happyNum">0 %</b></div>
      <button class="stat chip" id="terraChip" data-act="terra" title="Terraforming af Mars"><img class="ic" src="assets/icons/terraform.svg" alt=""><b>Trin <span id="terraNum">0</span></b></button>
      <button class="stat chip" id="powerChip" data-act="energy" title="Energinet"><img class="ic" src="assets/icons/energi.svg" alt=""><b id="powerNum">0/0</b></button>
      <button class="stat chip" id="popChip" data-act="pop" title="Befolkning og livsstøtte" hidden><img class="ic" src="assets/icons/befolkning.svg" alt=""><b id="popNum">4/4</b></button>
      <button class="stat fest-chip" id="festChip" data-act="festival" title="Marsfestivalen" hidden><img class="ic" src="assets/icons/festbillet.svg" alt=""><b id="festNum">0</b></button>
      <button class="stat clock" id="clock" data-act="season" title="Årstid og tid på Mars"></button>
    </div>
    <nav class="actions">
      <button data-act="orders" title="Ordrer"><img class="ic" src="assets/icons/rocket.svg" alt=""><span class="lbl">Ordrer</span><span id="orderBadge" class="badge" hidden>0</span></button>
      <button data-act="inventory" title="Lager"><img class="ic" src="assets/icons/box.svg" alt=""><span id="silo" class="silo-count">0/50</span></button>
      <button data-act="colony" title="Mål, robotter og kolonister"><img class="ic" src="assets/icons/goal.svg" alt=""><span class="lbl">Koloni</span><span id="colonyBadge" class="badge" hidden>0</span></button>
      <button data-act="music" id="musicBtn" class="icon-btn" aria-label="Musik til eller fra"></button>
      <button data-act="sound" id="soundBtn" class="icon-btn" aria-label="Lyd til eller fra"></button>
      <button data-act="help" class="icon-btn" aria-label="Hjælp">?</button>
    </nav>
  </header>

  <main>
    <div class="map-wrap">
      <canvas id="map" aria-label="Kort over kolonien"></canvas>
      <div id="tutorial" class="banner top" data-act="missions" hidden></div>
      <div id="visitBanner" class="banner top visit" hidden><img class="ic" src="assets/icons/nabo.svg" alt=""> <span>Besøg hos <b id="visitName"></b></span>
        <button class="primary" id="visitHelp" data-act="helpnb">Hjælp</button><button data-act="leavevisit">Tilbage</button></div>
      <div id="eventBanner" class="banner bottom" hidden></div>
      <div id="editBanner" class="banner top edit" hidden><img class="ic" src="assets/icons/flyt.svg" alt=""> Tryk på noget for at vælge det, og tryk derefter, hvor det skal stå. <button class="primary" data-act="editdone">Færdig</button></div>
      <div id="crewBanner" class="banner top edit" hidden><img class="ic" id="crewBannerIc" src="assets/icons/col-ida.svg" alt=""> <span id="crewBannerText"></span> <button data-act="crewcancel">Fortryd</button></div>
      <div class="fab-left">
        <button data-act="council" id="councilBtn" title="Kolonirådet" aria-label="Kolonirådet" hidden><img src="assets/icons/raad.svg" alt=""><span id="councilBadge" class="badge" hidden>1</span></button>
        <button data-act="crew" id="crewBtn" title="Specialister" aria-label="Specialister" hidden><img src="assets/icons/col-bo.svg" alt=""></button>
      </div>
      <div class="fab">
        <button data-act="arcade" id="arcadeBtn" title="Asteroidejagt" aria-label="Asteroidejagt" hidden><img src="assets/icons/joystick.svg" alt=""></button>
        <button data-act="photo" title="Tag et billede" aria-label="Tag et billede"><img src="assets/icons/kamera.svg" alt=""></button>
        <button data-act="neighbors" title="Naboer" aria-label="Naboer"><img src="assets/icons/nabo.svg" alt=""></button>
        <button data-act="edit" title="Flyt ting rundt" aria-label="Flyt ting rundt"><img src="assets/icons/flyt.svg" alt=""></button>
        <button data-act="collectall" class="collect" title="Saml alt" aria-label="Saml alt"><img src="assets/icons/saml.svg" alt=""></button>
        <button data-act="advisor" class="advisor" title="Hvad nu?"><img src="assets/icons/col-ida.svg" alt=""><span>Hvad nu?</span></button>
      </div>
    </div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="sheet-head">
        <h2 id="modalTitle"></h2>
        <button class="close" data-act="close" aria-label="Luk">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/native.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/music.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/state.js"></script>
  <script src="js/colony.js"></script>
  <script src="js/map.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/arcade.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
